<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar color="medium">
    <ion-title>Registra Tu Asistencia</ion-title>
    <ion-buttons slot="start">
      <ion-button [routerLink]="['/home']">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item lines="none">
      <ion-title class="ion-text-center">
        <h1>Bienvenido!</h1>
      </ion-title>
    </ion-item>
   
    <ion-item lines="none">
      Usuario: Seba
    </ion-item>
  </ion-list>

 
  <ion-button (click)="scanQRCode()">Escanear QR</ion-button>

  <ion-button (click)="clean()">Limpiar</ion-button>

  <ion-button id="btn_alert">Guardar</ion-button>
  <ion-alert trigger="btn_alert"
    header="Alumno"
    subHeader="Datos del Alumno"
    message="El usuario Seba se registró exitosamente"
    [buttons]="alertButtons">
  </ion-alert>
</ion-content>

<ion-footer>
  <ion-toolbar color="medium">
    <ion-title></ion-title>
  </ion-toolbar>
</ion-footer>
